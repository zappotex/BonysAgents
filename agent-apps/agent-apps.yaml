  - id: mcp-filesystem
    name: "Dateisystem (MCP)"
    kategorie: "Grundausstattung"
    beschreibung: "Offizieller MCP-Referenz-Server: Der Agent kann Dateien in einem freigegebenen Ordner lesen, schreiben und durchsuchen."
    agent_kann: "Dateien anlegen, lesen, bearbeiten, verschieben und durchsuchen – nur im freigegebenen Ordner."
    lizenz: "MIT"
    status: stabil
    homepage: "https://github.com/modelcontextprotocol/servers"
    quelle: "https://www.npmjs.com/package/@modelcontextprotocol/server-filesystem"
    pruefsumme: "npm prüft Pakete selbst"
    voraussetzungen: ["nodejs", "npm"]
    installation: |
      sudo apt install -y nodejs npm
      mkdir -p ~/Agent-Dateien
    mcp:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-filesystem", "~/Agent-Dateien"]
    hinweis: "Gib nie dein ganzes Home-Verzeichnis frei, nur den Arbeitsordner."
    geprueft_am: 2026-10-22

  - id: mcp-git
    name: "Git (MCP)"
    kategorie: "Grundausstattung"
    beschreibung: "Offizieller MCP-Referenz-Server für Git-Repositories."
    agent_kann: "Status, Änderungen und Verlauf ansehen, Dateien vormerken und Commits erstellen."
    lizenz: "MIT"
    status: stabil
    homepage: "https://github.com/modelcontextprotocol/servers"
    quelle: "https://pypi.org/project/mcp-server-git/"
    pruefsumme: "PyPI prüft Pakete selbst"
    voraussetzungen: ["git", "uv"]
    installation: |
      sudo apt install -y git pipx
      pipx install uv
      pipx ensurepath
    mcp:
      command: "~/.local/bin/uvx"
      args: ["mcp-server-git"]
    hinweis: "Passt gut zur Regel: Agenten arbeiten an Projekten nur über Git."
    geprueft_am: 2026-10-22

