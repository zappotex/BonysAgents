  - id: mcp-playwright
    name: "Playwright Browser (MCP)"
    kategorie: "Browser"
    beschreibung: "MCP-Server von Microsoft: Der Agent steuert einen echten Browser, klickt, füllt Formulare aus und macht Screenshots."
    agent_kann: "Webseiten bedienen, Formulare ausfüllen, Screenshots machen, Abläufe im Web automatisieren."
    lizenz: "Apache-2.0"
    status: stabil
    homepage: "https://github.com/microsoft/playwright-mcp"
    quelle: "https://www.npmjs.com/package/@playwright/mcp"
    pruefsumme: "npm prüft Pakete selbst"
    voraussetzungen: ["nodejs", "npm"]
    installation: |
      sudo apt install -y nodejs npm
      # Browser in genau der Version, die der MCP-Server erwartet (samt Systempaketen)
      npx -y @playwright/mcp@latest install-browser --with-deps chromium
    mcp:
      command: "npx"
      args: ["-y", "@playwright/mcp@latest", "--browser", "chromium"]
    hinweis: "Der Agent kann damit überall im Web klicken. Nicht mit eingeloggten Konten verwenden, die du nicht aus der Hand geben willst. Meldet der Server nach einem Update „Browser … is not installed“, die zweite Installationszeile noch einmal ausführen."
    geprueft_am: 2026-10-22
