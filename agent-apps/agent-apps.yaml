# Agenten-Apps – Liste für Bony's Agents
# ------------------------------------------------------------
# Diese Datei ist die einzige Quelle. Daraus erzeugt
# build_agent_apps.py die Seite index.html, die auf jedem
# Agent-PC als Desktop-Verknüpfung liegt, und die Online-Version
# (GitHub Pages, .github/workflows/agenten-apps.yml).
#
# Regeln für Einträge:
# - Nur offizielle Quellen (Hersteller-Website, offizielles Repo).
# - "geprueft_am" setzen, wenn Befehle und MCP-Eintrag in einem
#   frischen Agent-PC (Debian 13) wirklich getestet wurden.
#   Einträge, die nicht funktionieren, auskommentieren statt raten.
# - status: stabil | beta | alpha
# - Downloads von GitHub ohne feste Versionsnummer: Die Befehle holen
#   SHA256SUMS.txt aus dem neuesten Release, lesen daraus den Dateinamen
#   und prüfen die Prüfsumme. "uname -m" wählt x86_64 oder aarch64.
# ------------------------------------------------------------

meta:
  titel: "Agenten-Apps"
  untertitel: "Programme, die dein Hermes-Agent selbst bedienen kann"
  # Online-Version der Liste (wird ohne neues Release aktualisiert)
  online_url: "https://zappotex.github.io/BonysAgents/agenten-apps/"
  arbeitsordner: "~/Agent-Dateien"
  hermes_tipp: >
    Du musst nichts selbst eintippen: Sag deinem Agenten in Telegram
    zum Beispiel „Installiere PdfCraft aus der Agenten-Liste und
    richte den MCP-Server ein“. Er zeigt dir vorher, was er tut.

vorinstalliert:
  - id: n8n
    name: "n8n"
    beschreibung: "Workflows per Klick bauen: Mails, RSS, Telegram, Dateien, APIs. Hermes kann Workflows anstoßen und n8n kann Hermes Aufgaben geben."
    lizenz: "Sustainable Use License (Quellcode offen, aber keine OSI-Open-Source-Lizenz)"
    oeffnen: "http://localhost:5678"
    homepage: "https://n8n.io"
    hinweis: "Läuft im Agent-PC in Docker und ist nur im Agent-PC selbst erreichbar."

apps:
  - id: pdfcraft
    name: "PdfCraft"
    kategorie: "Dokumente"
    beschreibung: "PDFs lesen, durchsuchen, zusammenfügen, aufteilen, kommentieren und Formulare ausfüllen."
    agent_kann: "Text aus PDFs lesen, Seiten drehen/löschen/verschieben, PDFs kombinieren und aufteilen, Kommentare setzen, Formulare ausfüllen."
    lizenz: "MIT oder Apache-2.0"
    status: alpha
    homepage: "https://getartcraft.com/apps/pdfcraft"
    quelle: "https://github.com/storytold/pdfcraft/releases/latest"
    pruefsumme: "SHA256SUMS.txt im Release"
    voraussetzungen: []
    installation: |
      # Nur das Kommandozeilen-Werkzeug mit MCP-Server (ohne Oberfläche)
      mkdir -p ~/Downloads/pdfcraft && cd ~/Downloads/pdfcraft
      wget -N https://github.com/storytold/pdfcraft/releases/latest/download/SHA256SUMS.txt
      DATEI=$(grep -o "pdfcraft-cli-[0-9.]*-linux-$(uname -m)\.tar\.gz" SHA256SUMS.txt | head -n1)
      wget -N "https://github.com/storytold/pdfcraft/releases/latest/download/$DATEI"
      sha256sum --check --ignore-missing SHA256SUMS.txt
      mkdir -p ~/.local/bin && tar -xzf "$DATEI" -C ~/.local/bin --strip-components=1
      mkdir -p ~/Agent-Dateien/pdf
    mcp:
      command: "~/.local/bin/pdfcraft-cli"
      args: ["mcp", "--compact", "--root", "~/Agent-Dateien/pdf"]
    hinweis: "Der MCP-Server startet nur, wenn der Agent ihn aufruft, und öffnet keinen Netzwerk-Port. --root beschränkt den Agenten auf den Ordner ~/Agent-Dateien/pdf."
    geprueft_am: 2026-10-22

  - id: photocraft
    name: "PhotoCraft"
    kategorie: "Bilder"
    beschreibung: "Bildbearbeitung mit Ebenen, Masken, Filtern und echten PSD-Dateien – ähnlich wie Photoshop."
    agent_kann: "Bilder öffnen, Filter und Korrekturen anwenden, ganze Ordner im Stapel bearbeiten, exportieren."
    lizenz: "MIT oder Apache-2.0"
    status: alpha
    homepage: "https://getartcraft.com/apps/photocraft"
    quelle: "https://github.com/storytold/photocraft/releases/latest"
    pruefsumme: "SHA256SUMS.txt im Release"
    voraussetzungen: []
    installation: |
      mkdir -p ~/Downloads/photocraft && cd ~/Downloads/photocraft
      wget -N https://github.com/storytold/photocraft/releases/latest/download/SHA256SUMS.txt
      DATEI=$(grep -o "photocraft-[0-9.]*-linux-$(uname -m)\.deb" SHA256SUMS.txt | head -n1)
      wget -N "https://github.com/storytold/photocraft/releases/latest/download/$DATEI"
      sha256sum --check --ignore-missing SHA256SUMS.txt
      sudo apt install -y "./$DATEI"
      mkdir -p ~/Agent-Dateien/bilder
    mcp:
      command: "photocraft-cli"
      args: ["mcp", "--automation-read-root", "~/Agent-Dateien/bilder", "--automation-write-root", "~/Agent-Dateien/bilder"]
    hinweis: "Noch frühe Alpha: für Experimente gut, für wichtige Arbeit vorher Kopien anlegen. Der Agent liest und speichert nur im Ordner ~/Agent-Dateien/bilder (Pfade dort relativ angeben)."
    geprueft_am: 2026-10-22

