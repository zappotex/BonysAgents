name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # feste Fassung statt ubuntu-latest: ein neues Runner-Image (zuletzt 26.04 am 20.10.2026) soll keinen Lauf
        # unbemerkt rot machen – umstellen nur bewusst
        os: [ubuntu-26.04, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Linux-Bibliotheken für Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 qemu-utils
      - run: pip install -e ".[dev]"
      - name: C-Compiler für die QEMU-Attrappe der Tests
        if: runner.os != 'Windows'
        run: cc --version
      - run: ruff check src tests packaging/editions.py packaging/check-edition.py packaging/collect-licenses.py
      - name: Tests – Kursleiter-Version (alles)
        run: pytest -q -v -rs --edition kursleiter
      - name: Tests – Anwender-Version (ohne bonys_agents.trainer)
        run: pytest -q --edition anwender

  # Bony's VPN aus dem echten Release von zappotex/bonys-vpn (Signatur, SHA-256, apt):
  # Installationsschritt im Agent-PC (Debian 13, auch als Umstellung einer alten Fassung) und Knopf
  # „Bony's VPN installieren“ auf dem eigenen Rechner (Ubuntu).
  bonys-vpn:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install platformdirs psutil pycdlib
      - name: Agent-PC – App-Option „WireGuard VPN (Bony's VPN)“ in Debian 13 (mit alter Fassung unter /usr/local)
        run: |
          PYTHONPATH=src python -c "from bonys_agents import apps, cloudinit; print(cloudinit.app_install_script(apps.VPN, 'agent'), end='')" > vpn-install.sh
          docker run --rm -v "$PWD/vpn-install.sh:/vpn-install.sh:ro" debian:trixie bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq sudo polkitd python3 >/dev/null
            useradd -m -s /bin/bash agent
            # Reste der alten, eingebauten Fassung (Bony'"'"'s Agents 0.14)
            install -d /usr/local/sbin /usr/local/bin /usr/local/lib/bonys-vpn /etc/polkit-1/rules.d /home/agent/Schreibtisch
            for f in /usr/local/sbin/bonys-vpn-helper /usr/local/bin/bonys-vpn /usr/local/bin/bonys-vpn-gui; do
              printf "#!/bin/sh\nexit 0\n" > $f; chmod 755 $f; done
            printf "polkit.addRule(function(action, subject) { if (action.id == \"io.github.bonys-agents.vpn\" && subject.user == \"agent\") { return polkit.Result.YES; } });\n" \
              > /etc/polkit-1/rules.d/50-bonys-vpn.rules
            echo alt > /home/agent/Schreibtisch/io.github.bonys_agents.vpn.desktop
            install -d -m700 /etc/wireguard && echo "# Platzhalter" > /etc/wireguard/test.conf && chmod 600 /etc/wireguard/test.conf
            bash /vpn-install.sh
            bonys-vpn version --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d[\"schema\"] == 1, d; print(d)"
            dpkg -s bonys-vpn-agentpc | grep -q "Status: install ok installed"
            id -nG agent | grep -qw bonys-vpn
            test ! -e /usr/local/sbin/bonys-vpn-helper && test ! -e /usr/local/lib/bonys-vpn
            test ! -e /etc/polkit-1/rules.d/50-bonys-vpn.rules
            test -f /home/agent/Schreibtisch/bonys-vpn.desktop && test ! -e /home/agent/Schreibtisch/io.github.bonys_agents.vpn.desktop
            test "$(cat /etc/wireguard/test.conf)" = "# Platzhalter"   # Tunnel bleiben unverändert
            test -f /etc/apt/sources.list.d/bonys-vpn.sources
          '
      - name: Eigener Rechner – „Bony's VPN installieren“ (geprüftes .deb aus dem Release)
        run: |
          sudo apt-get update -qq
          python -c "
          import subprocess
          from bonys_agents import hostvpn
          assert hostvpn.gui_command() is None and not hostvpn.apt_configured()
          v = hostvpn.install(print, runner=lambda s: subprocess.call(['sudo', 'sh', '-c', s]))
          print('installiert:', v)
          assert hostvpn.gui_command() == '/usr/bin/bonys-vpn-gui' and hostvpn.installed_version() == v
          "
          bonys-vpn version --json
        env:
          PYTHONPATH: src

  # WireGuard auf dem eigenen Rechner unter Windows und macOS (Menü „Extras“)
  wireguard-host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Menü „Extras“ und Dialoge der Desktop-App
        run: pytest -q tests/test_hostvpn.py
      - name: Windows – offizielle WireGuard-App per winget installieren (wie „Extras → WireGuard …“)
        if: runner.os == 'Windows'
        run: |
          winget --version
          python -c "from bonys_agents import hostvpn; assert hostvpn.windows_app() is None; hostvpn.windows_install(); exe = hostvpn.windows_app(); print('installiert:', exe); assert exe"
      - name: macOS – App-Store-Seite der offiziellen WireGuard-App erreichbar
        if: runner.os == 'macOS'
        run: |
          URL=$(python -c "from bonys_agents import hostvpn; assert hostvpn.mac_app() is None; print(hostvpn.MAC_APP_STORE_URL)")
          echo "$URL"
          curl -fsSL -A "Mozilla/5.0" -o page.html "$URL"
          grep -qi "wireguard" page.html
