name: Release

# Ein Tag wie "v0.8.0" baut automatisch – je Edition (docs/editionen.md; Kursleiter-Dateien mit „-kursleiter“ bzw.
# „-Kursleiter“ im Namen):
#   - bonys-agents_<version>_amd64.deb / _arm64.deb   (Debian, Ubuntu, Mint …; bonys-agents-kursleiter_…)
#   - BonysAgents-Setup-<version>.exe                  (Windows-Installer; BonysAgents-Kursleiter-Setup-…)
#   - BonysAgents-<version>-macos-applesilicon.dmg     (macOS, Apple-Chip M1 … – arm64; BonysAgents-Kursleiter-…)
#   - BonysAgents-<version>-macos-intel.dmg            (macOS, Intel – x86_64)
#   - BonysAgents-Benutzerhandbuch-<version>.pdf, …-Kursleiter-Handbuch-…, Beispielkurs (docs/handbuch/)
#   - SHA256SUMS + SHA256SUMS.minisig                  (Prüfsummen aller Dateien, signiert – die App prüft sie vor
#                                                       jedem Update; Updates bleiben in der eigenen Edition)
# hängt alles an eine GitHub-Release-Seite und veröffentlicht danach die signierte APT-Paketquelle
# auf GitHub Pages (https://<besitzer>.github.io/<repository>/apt/) – gemeinsam mit Bony's VPN, siehe apt-repo.yml.
# Ohne Tag (manuell über "Run workflow") entstehen die Dateien nur als Artefakte zum Testen.
#
# Benötigte GitHub-Secrets (Settings → Secrets and variables → Actions) – Anleitung: docs/RELEASE.md
#   MINISIGN_SECRET_KEY   Inhalt der minisign-Schlüsseldatei (ohne Passwort erzeugt: minisign -G -W)
#   APT_GPG_PRIVATE_KEY   GPG-Schlüssel für die Paketquelle (gpg --armor --export-secret-keys …)
#   APT_GPG_PASSPHRASE    dessen Passphrase (leer lassen, wenn der Schlüssel keine hat)
#   optional für macOS (Signierung mit Apple-Developer-ID + Notarisierung, sonst ad-hoc):
#   APPLE_CERT_P12, APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
# Ohne MINISIGN_SECRET_KEY bzw. APT_GPG_PRIVATE_KEY bricht das Release ab (nichts wird veröffentlicht);
# ohne Apple-Secrets wird ad-hoc signiert. Veröffentlicht wird nur, wenn der Test-Job grün ist.
# Außerdem: Settings → Pages → Source „GitHub Actions“ und unter Settings → Environments →
# github-pages die Tags „v*“ und den Branch „main“ als Deployment-Regeln erlauben.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nur Leserechte – Schreibrechte bekommt allein der Job „release“
permissions:
  contents: read

jobs:
  # Wie ci.yml: ein Tag auf einem roten Commit wird nicht veröffentlicht
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Linux-Bibliotheken für Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 qemu-utils
      - run: pip install -e ".[dev]"
      - run: ruff check src tests packaging/editions.py packaging/check-edition.py packaging/collect-licenses.py
      - name: Tests – Kursleiter-Version (alles)
        run: pytest -q --edition kursleiter
      - name: Tests – Anwender-Version (ohne bonys_agents.trainer)
        run: pytest -q --edition anwender

  deb:
    strategy:
      matrix:
        # Ubuntu 22.04 als Bau-Basis: das Paket läuft dann ab glibc 2.35
        # (Debian 12/13, Ubuntu 22.04+, Linux Mint 21+).
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: .deb bauen – beide Editionen (prüft dabei, dass die Anwender-Version kein trainer/ und kein noVNC enthält)
        run: |
          packaging/linux/build-deb.sh anwender
          packaging/linux/build-deb.sh kursleiter
          ls -la dist/*.deb
      - name: Paketinhalt prüfen – gleiche Pfade, keine Conflicts, Anwender ohne Kursleiter-Teile
        run: PYTHON=build/venv/bin/python packaging/linux/check-debs.sh dist/bonys-agents_*.deb dist/bonys-agents-kursleiter_*.deb
      - name: Paket testweise installieren und die Edition wechseln (Anwender → Kursleiter → Anwender)
        run: |
          A=$(ls dist/bonys-agents_*.deb); K=$(ls dist/bonys-agents-kursleiter_*.deb)
          sudo apt-get update
          sudo apt-get install -y python3-apt
          sudo apt-get install -y "./$A"
          bonys-agents --version | tee v.txt; grep -q '(Anwender)$' v.txt
          # Wie der grafische Installer (captain/gdebi, python-apt) beim Doppelklick prüft – in beide Richtungen
          checkdeb() { /usr/bin/python3 -c 'import sys, apt, apt.debfile; d = apt.debfile.DebPackage(sys.argv[1], apt.Cache()); ok = d.check(); print(sys.argv[1], ok, d._failure_string); sys.exit(0 if ok else 1)' "$1"; }
          checkdeb "$K"
          bonys-agents selftest
          QT_QPA_PLATFORM=offscreen timeout 5 bonys-agents-gui || [ $? -eq 124 ]
          set +e; bonys-agents present irgendwas; rc=$?; set -e
          [ "$rc" -eq 2 ] || { echo "::error::present in der Anwender-Version: $rc"; exit 1; }
          # Bony's VPN ist ein eigenes Paket: hier nur „Suggests“, keine Dateien davon
          dpkg-deb -f "$A" Suggests | grep -qw bonys-vpn
          if dpkg -L bonys-agents | grep -qE 'bonys-vpn|polkit|systemd'; then echo "Dateien von Bony's VPN im Paket" >&2; exit 1; fi
          # Daten, die beim Wechsel bleiben müssen
          mkdir -p ~/.local/share/bonys-agents && echo bleibt > ~/.local/share/bonys-agents/wechsel-test
          sudo apt-get install -y "./$K"        # ersetzt bonys-agents
          ! dpkg-query -W -f='${db:Status-Status}' bonys-agents 2>/dev/null | grep -qx installed
          bonys-agents --version | tee v.txt; grep -q '(Kursleiter)$' v.txt
          bonys-agents present --help >/dev/null
          grep -qx "Name=Bony's Agents Kursleiter" /usr/share/applications/bonys-agents.desktop
          QT_QPA_PLATFORM=offscreen timeout 5 bonys-agents-gui || [ $? -eq 124 ]
          checkdeb "$A"
          sudo apt-get install -y "./$A"        # und zurück
          ! dpkg-query -W -f='${db:Status-Status}' bonys-agents-kursleiter 2>/dev/null | grep -qx installed
          bonys-agents --version | grep -q '(Anwender)$'
          [ ! -e /opt/bonys-agents/_internal/bonys_agents/trainer ]
          grep -qx bleibt ~/.local/share/bonys-agents/wechsel-test
          # Paketquelle für Updates übersteht den Wechsel
          test -f /etc/apt/sources.list.d/bonys-agents.sources
      # Neuere Systeme als die Bau-Basis: dort fielen mitgelieferte Bibliotheken zuerst auf
      # (QEMU: „libmount.so.1: version `MOUNT_2_40' not found“).
      - name: In Debian 13 und Ubuntu 24.04 installieren und Selbsttest (beide Editionen)
        run: |
          for image in debian:trixie ubuntu:24.04; do
            for pkg in bonys-agents_ bonys-agents-kursleiter_; do
              echo "::group::$image $pkg"
              docker run --rm -v "$PWD/dist:/dist:ro" -e PKG="$pkg" "$image" bash -euxc '
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq /dist/${PKG}*.deb > /dev/null
                bonys-agents --version
                bonys-agents selftest
                QT_QPA_PLATFORM=offscreen timeout 10 bonys-agents-gui || [ $? -eq 124 ]
              '
              echo "::endgroup::"
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.runner }}
          path: dist/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Programm bündeln – beide Editionen
        shell: bash
        run: |
          python packaging/fetch-novnc.py
          python packaging/fetch-livekit.py   # Kursraum (beide Editionen)
          pip install --require-hashes -r packaging/requirements-build.txt   # feste Versionen mit Prüfsummen
          pip install --no-deps --no-build-isolation .
          for ed in anwender kursleiter; do
            pyinstaller --noconfirm --log-level WARN --workpath "build/pyinstaller-$ed" packaging/bonys-agents.spec -- --edition $ed
          done
          python packaging/collect-licenses.py dist/bonys-agents
          python packaging/collect-licenses.py dist/bonys-agents-kursleiter
          python packaging/check-edition.py dist/bonys-agents anwender
          python packaging/check-edition.py dist/bonys-agents-kursleiter kursleiter
          dist/bonys-agents/bonys-agents.exe --version
          dist/bonys-agents-kursleiter/bonys-agents.exe --version
      - name: Installer bauen
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = python -c "import bonys_agents; print(bonys_agents.__version__)"
          foreach ($ed in @("anwender", "kursleiter")) {
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" "/DEdition=$ed" packaging\windows\bonys-agents.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem dist\*.exe
      - name: Installer testweise still installieren und die Edition wechseln
        shell: pwsh
        run: |
          $app = "${env:ProgramFiles}\Bony's Agents"
          function Install($pattern) {
            $setup = Get-ChildItem "dist\$pattern" | Select-Object -First 1
            Start-Process $setup.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS="desktopicon"' -Wait
          }
          function Version() { (& "$app\bonys-agents.exe" --version) | Out-String }
          Install "BonysAgents-Setup-*.exe"
          if ((Version) -notmatch "\(Anwender\)") { throw "Anwender-Version erwartet: $(Version)" }
          & "$app\bonys-agents.exe" present x; if ($LASTEXITCODE -ne 2) { throw "present in der Anwender-Version: $LASTEXITCODE" }
          Install "BonysAgents-Kursleiter-Setup-*.exe"
          if ((Version) -notmatch "\(Kursleiter\)") { throw "Kursleiter-Version erwartet: $(Version)" }
          if (-not (Test-Path "$app\_internal\bonys_agents\trainer")) { throw "Kursleiter-Dateien fehlen" }
          Install "BonysAgents-Setup-*.exe"
          if ((Version) -notmatch "\(Anwender\)") { throw "Zurück auf Anwender erwartet: $(Version)" }
          if (Test-Path "$app\_internal\bonys_agents\trainer") { throw "Kursleiter-Dateien nach dem Wechsel noch da" }
          $keys = Get-ChildItem "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Get-ItemProperty | Where-Object { $_.DisplayName -like "Bony's Agents*" }
          $keys | Select-Object DisplayName, DisplayVersion | Format-Table
          if (@($keys).Count -ne 1) { throw "Erwartet genau einen Eintrag unter Apps, gefunden: $(@($keys).Count)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-setup
          path: dist/BonysAgents-*Setup-*.exe

  macos:
    # Zwei getrennte Builds statt universal2: PyInstaller schneidet dann jede Bibliothek auf den Chip zu
    # (halb so groß), und jede Variante wird auf echter Hardware ihrer Art getestet.
    # macos-15-intel ist der letzte Intel-Runner von GitHub (unterstützt bis August 2027).
    # Je Chip beide Editionen. Die App heißt in beiden „Bony's Agents.app“ (gleiche Bundle-ID) – die eine ersetzt
    # in „Programme“ die andere; die .dmg-Namen unterscheiden sich.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
        edition: [anwender, kursleiter]
        include:
          - runner: macos-latest
            arch: arm64
            flavor: applesilicon
          - runner: macos-15-intel
            arch: x86_64
            flavor: intel
          - edition: anwender
            prefix: BonysAgents
            label: Anwender
            volname: Bony's Agents
          - edition: kursleiter
            prefix: BonysAgents-Kursleiter
            label: Kursleiter
            volname: Bony's Agents Kursleiter
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Optional (siehe docs/RELEASE.md): Signierung mit Apple-Developer-ID und Notarisierung.
      # Fehlen sie, wird ad-hoc signiert – der Build läuft trotzdem durch. Die Secrets selbst stehen nur in
      # den beiden Schritten, die sie brauchen (nicht in pip, PyInstaller, Homebrew …).
      NOTARIZE: ${{ secrets.APPLE_CERT_P12 != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: App bauen
        run: |
          sw_vers; uname -m
          if [ "${{ matrix.edition }}" = kursleiter ]; then python packaging/fetch-novnc.py; fi
          python packaging/fetch-livekit.py   # Kursraum (beide Editionen)
          pip install --require-hashes -r packaging/requirements-build.txt   # feste Versionen mit Prüfsummen
          pip install --no-deps --no-build-isolation .
          pyinstaller --noconfirm --log-level WARN packaging/bonys-agents.spec -- --edition ${{ matrix.edition }}
          python packaging/collect-licenses.py "dist/Bony's Agents.app"
          python packaging/check-edition.py "dist/Bony's Agents.app" ${{ matrix.edition }}
          v=$(python -c "import bonys_agents; print(bonys_agents.__version__)")
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "DMG=dist/${{ matrix.prefix }}-$v-macos-${{ matrix.flavor }}.dmg" >> "$GITHUB_ENV"
          [ "$(plutil -extract CFBundleDisplayName raw "dist/Bony's Agents.app/Contents/Info.plist")" = "${{ matrix.volname }}" ]
          [ "$(plutil -extract CFBundleIdentifier raw "dist/Bony's Agents.app/Contents/Info.plist")" = "io.github.bonys-agents" ]
          plutil -p "dist/Bony's Agents.app/Contents/Info.plist"
          # Sonst ist die App ein unsichtbarer Hintergrunddienst (bis 0.12.0 der Fall)
          [ "$(plutil -extract LSBackgroundOnly raw "dist/Bony's Agents.app/Contents/Info.plist")" = "false" ]
      - name: Architektur und Mindest-macOS jeder Programmdatei prüfen
        run: packaging/macos/check-min-macos.sh "dist/Bony's Agents.app" "${{ matrix.arch }}"
      - name: Signieren (Developer-ID, sonst ad-hoc)
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          identity=$(packaging/macos/sign.sh "dist/Bony's Agents.app")
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          codesign -dv --verbose=2 "dist/Bony's Agents.app" 2>&1 | grep -E "^(Identifier|Format|Signature|Authority|TeamIdentifier)"
      - name: .dmg bauen
        run: |
          packaging/macos/build-dmg.sh "dist/Bony's Agents.app" "$DMG" "${{ matrix.volname }}"
          if [ "$SIGN_IDENTITY" != "-" ]; then codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"; fi
          ls -la dist/*.dmg
      - name: Notarisieren (nur mit Apple-Secrets)
        if: env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
      - name: Test – .dmg einhängen, App in „Programme“ kopieren, starten
        run: |
          t() { perl -e 'alarm shift; exec {$ARGV[0]} @ARGV' "$@"; }  # macOS hat kein „timeout“
          MNT="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          [ "$(readlink "$MNT/Programme")" = "/Applications" ]
          ditto "$MNT/Bony's Agents.app" "/Applications/Bony's Agents.app"
          hdiutil detach "$MNT"
          APP="/Applications/Bony's Agents.app"
          echo "CLI=$APP/Contents/MacOS/bonys-agents" >> "$GITHUB_ENV"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute -vv "$APP" || echo "Gatekeeper: nicht notarisiert – beim ersten Start fragt macOS nach (siehe README)."
          file "$APP/Contents/MacOS/"*
          "$APP/Contents/MacOS/bonys-agents" --version | tee version.txt
          grep -qx "bonys-agents $VERSION (${{ matrix.label }})" version.txt
          # Desktop-App ohne Bildschirm: muss nach 5 s noch laufen (Alarm-Code 142) und ohne Stylesheet-Fehler
          set +e
          QT_QPA_PLATFORM=offscreen t 5 "$APP/Contents/MacOS/BonysAgents" > gui.log 2>&1; rc=$?
          set -e
          cat gui.log
          [ "$rc" -eq 142 ] || { echo "::error::Desktop-App ist nach $rc beendet"; exit 1; }
          ! grep -q "Could not parse" gui.log
      - name: Test – echter Start im Finder (Dock, Vordergrund)
        run: |
          APP="/Applications/Bony's Agents.app"
          open "$APP"
          for i in $(seq 1 30); do pgrep -x BonysAgents >/dev/null && break; sleep 1; done
          sleep 8
          mkdir -p shots && screencapture -x "shots/app-${{ matrix.flavor }}-${{ matrix.edition }}.png" || true
          bg=$(perl -e 'alarm 20; exec {$ARGV[0]} @ARGV' osascript -e \
            'tell application "System Events" to get background only of first process whose name is "BonysAgents"' || echo "?")
          echo "background only: $bg"
          [ "$bg" != "true" ] || { echo "::error::App läuft als Hintergrunddienst (LSBackgroundOnly)"; exit 1; }
          pgrep -x BonysAgents
          osascript -e 'quit app "Bony'"'"'s Agents"' || pkill -x BonysAgents || true
      - name: Test – doctor vor QEMU
        run: '"$CLI" doctor || true'
      - name: Test – Kursleiter-Befehle nur in der Kursleiter-Version
        run: |
          set +e; "$CLI" present irgendwas; rc=$?; set -e
          if [ "${{ matrix.edition }}" = anwender ]; then [ "$rc" -eq 2 ]; else "$CLI" present --help > /dev/null; fi
      - name: Test – QEMU über Homebrew, doctor und Bootversuch eines Agent-PCs
        if: matrix.edition == 'anwender'
        run: |
          brew install qemu
          "$CLI" doctor || true    # HVF fehlt auf den (virtualisierten) Runnern – das ist hier erwartet
          "$CLI" doctor | grep -E "^(Mac|Homebrew|HVF|qemu-system|UEFI)"
          "$CLI" selftest --boot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.flavor }}-${{ matrix.edition }}
          path: dist/BonysAgents-*-macos-*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshot-macos-${{ matrix.flavor }}-${{ matrix.edition }}
          path: shots

  macos-compat:
    # Die fertige .dmg auf dem ältesten unterstützten macOS (LSMinimumSystemVersion, siehe Spec) starten –
    # die mitgelieferten Bibliotheken dürfen dort keine fehlenden Systemfunktionen brauchen.
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-applesilicon-anwender
      - name: Installieren und starten
        run: |
          sw_vers; uname -m
          t() { perl -e 'alarm shift; exec {$ARGV[0]} @ARGV' "$@"; }
          MNT="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" BonysAgents-[0-9]*-macos-applesilicon.dmg
          ditto "$MNT/Bony's Agents.app" "/Applications/Bony's Agents.app"
          hdiutil detach "$MNT"
          APP="/Applications/Bony's Agents.app"
          plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/bonys-agents" --version
          "$APP/Contents/MacOS/bonys-agents" doctor || true
          "$APP/Contents/MacOS/bonys-agents" selftest || true
          set +e
          QT_QPA_PLATFORM=offscreen t 5 "$APP/Contents/MacOS/BonysAgents" > gui.log 2>&1; rc=$?
          set -e
          cat gui.log
          [ "$rc" -eq 142 ] || { echo "::error::Desktop-App ist auf $(sw_vers -productVersion) nach $rc beendet"; exit 1; }
          open "$APP"; sleep 10
          pgrep -x BonysAgents || { echo "::error::Desktop-App läuft nach dem Öffnen nicht"; exit 1; }
          mkdir -p shots && screencapture -x "shots/${{ matrix.runner }}.png" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshot-compat-${{ matrix.runner }}
          path: shots

  # Handbücher als PDF (docs/handbuch/, Pandoc + Typst) – mit den Bildschirmfotos aus dem Repository
  handbuch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PANDOC_VERSION: "3.12.1"
      PANDOC_SHA256: d0c90410e90204c9ca83b8539fac5c7aed01fd537207e4585849f8abc5df20b8
      TYPST_VERSION: "0.15.1"
      TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Pandoc und Typst (feste Versionen, Prüfsumme)
        run: |
          mkdir -p "$RUNNER_TEMP/werkzeuge/bin"
          cd "$RUNNER_TEMP/werkzeuge"
          curl -fsSLO "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_SHA256}  pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | sha256sum -c
          curl -fsSLO "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  typst-x86_64-unknown-linux-musl.tar.xz" | sha256sum -c
          tar xzf "pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          tar xJf typst-x86_64-unknown-linux-musl.tar.xz
          install -m755 "pandoc-${PANDOC_VERSION}/bin/pandoc" typst-x86_64-unknown-linux-musl/typst bin/
          echo "$RUNNER_TEMP/werkzeuge/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji fonts-dejavu-core
      - run: docs/handbuch/erstellen.sh --ohne-bilder
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handbuch
          path: docs/handbuch/pdf/*.pdf

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, deb, windows, macos, macos-compat, handbuch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Prüfsummen (SHA256SUMS) erzeugen und signieren
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::Secret MINISIGN_SECRET_KEY fehlt – ohne signierte SHA256SUMS wird nichts veröffentlicht (siehe docs/RELEASE.md)."
            exit 1
          fi
          sudo apt-get install -y -qq minisign
          KEY="$RUNNER_TEMP/minisign.key"
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY")
          trap 'rm -f "$KEY"' EXIT
          # Mitgelieferte Kurspakete signieren (pruefsummen.txt.minisig) und als .bonyspaket packen – samt
          # kurspakete-index.json für das Repo zappotex/bonys-agents-kurspakete (docs/RELEASE.md)
          pip install -q "platformdirs==4.13.2" "psutil==7.2.2" "pycdlib==1.22.0"
          python3 packaging/kurspakete.py vorbereiten "$RUNNER_TEMP/kurspakete"
          for f in "$RUNNER_TEMP"/kurspakete/*/pruefsummen.txt; do
            minisign -S -s "$KEY" -m "$f" -x "$f.minisig" -t "Kurspaket von Bony's Agents ${GITHUB_REF_NAME}"
          done
          python3 packaging/kurspakete.py packen "$RUNNER_TEMP/kurspakete" out
          cd out
          sha256sum -- *.deb *.exe *.dmg *.pdf *.bonyspaket kurspakete-index.json > SHA256SUMS
          cat SHA256SUMS
          # Die App prüft, dass der vertrauenswürdige Kommentar genau diese Version nennt.
          minisign -S -s "$KEY" -m SHA256SUMS -t "Bony's Agents ${GITHUB_REF_NAME}"
          rm -f "$KEY"
          # Gegenprobe mit dem öffentlichen Schlüssel, der fest in der App steckt
          PUB="$(sed -n 's/^UPDATE_PUBLIC_KEY = "\(.*\)"/\1/p' ../src/bonys_agents/__init__.py)"
          if [ -z "$PUB" ]; then
            echo "::error::UPDATE_PUBLIC_KEY in src/bonys_agents/__init__.py ist leer – die App könnte die Signatur nicht prüfen."
            exit 1
          fi
          minisign -V -m SHA256SUMS -P "$PUB"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            out/*.deb
            out/*.exe
            out/*.dmg
            out/*.pdf
            out/*.bonyspaket
            out/kurspakete-index.json
            out/SHA256SUMS
            out/SHA256SUMS.minisig
          body: |
            **Welche Version brauche ich?**

            | Du möchtest … | Version | Dateien |
            |---|---|---|
            | eigene Agent-PCs nutzen **oder an einer Schulung teilnehmen** (beitreten, Vorführung ansehen, Hilfe anfordern) | **Bony's Agents** | `bonys-agents_…deb`, `BonysAgents-Setup-….exe`, `BonysAgents-…-macos-….dmg` |
            | selbst **Schulungen geben** (Vorlage im Netz freigeben, vorführen, Hilfe-Anfragen annehmen) | **Bony's Agents Kursleiter** | `bonys-agents-kursleiter_…deb`, `BonysAgents-Kursleiter-Setup-….exe`, `BonysAgents-Kursleiter-…-macos-….dmg` |

            Teilnehmer brauchen nur die normale Version. Die Kursleiter-Version enthält alles aus der normalen. Wechseln geht
            jederzeit in beide Richtungen – einfach die andere Version installieren; Agent-PCs, Vorlagen und Einstellungen bleiben.

            **Handbücher (PDF):** `BonysAgents-Benutzerhandbuch-….pdf` für alle, `BonysAgents-Kursleiter-Handbuch-….pdf` für
            Kursleiter, dazu der Beispielkurs „Einführung in Hermes Agent“ (Ablaufplan und Handout).

            **Kurspakete (`.bonyspaket`):** die mitgelieferten Kurspakete, signiert – auch zum Weitergeben (Fenster „Kurse“ →
            „Kurspakete“ → „Importieren …“).

            **Installieren – ganz ohne Terminal:**
            - **Windows:** `BonysAgents-Setup-….exe` (bzw. `BonysAgents-Kursleiter-Setup-….exe`) herunterladen und doppelklicken.
            - **Debian / Ubuntu / Linux Mint:** die passende `.deb`-Datei herunterladen und doppelklicken
              (öffnet die Softwareverwaltung) → „Installieren“. Für die meisten PCs: `amd64`.
              Spätere Updates kommen dann über die Aktualisierungsverwaltung.
            - **macOS 14 oder neuer:** Mac mit Apple-Chip (M1, M2 …): `…-macos-applesilicon.dmg`,
              Mac mit Intel-Prozessor: `…-macos-intel.dmg` (Apple-Menü  → „Über diesen Mac“ zeigt den Chip).
              Öffnen und „Bony's Agents“ auf „Programme“ ziehen.

            **Erster Start auf dem Mac** (nur einmal nötig – die App ist nicht von Apple notarisiert):
            1. Bony's Agents im Ordner „Programme“ doppelklicken → Meldung *„Bony's Agents“ nicht geöffnet* → **„Fertig“**.
            2. Apple-Menü  → **Systemeinstellungen → Datenschutz & Sicherheit** → ganz unten bei „Sicherheit“ **„Dennoch öffnen“** → mit Passwort/Touch ID bestätigen.
            3. Noch einmal öffnen → **„Dennoch öffnen“**.

            macOS 14 (Sonoma): stattdessen Rechtsklick auf die App → **„Öffnen“** → **„Öffnen“**.
            Klappt beides nicht, im Terminal: `xattr -cr "/Applications/Bony's Agents.app"`.
            Mit Bildern: [Anleitung in der README](https://github.com/${{ github.repository }}#erster-start)

            <img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docs/images/macos/1-nicht-geoeffnet.png" alt="Schritt 1: „Fertig“" height="260"> <img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docs/images/macos/2-datenschutz-sicherheit.png" alt="Schritt 2: Datenschutz & Sicherheit → Dennoch öffnen" height="260">

            Prüfsummen: `SHA256SUMS`, signiert mit minisign (`SHA256SUMS.minisig`).

  # Gemeinsame APT-Paketquelle mit Bony's VPN – holt die .deb aus den neuesten Releases beider Projekte
  apt-repo:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt-repo.yml
    secrets: inherit
