name: APT-Paketquelle

# Gemeinsame APT-Paketquelle von Bony's Agents und Bony's VPN auf GitHub Pages
# (https://zappotex.github.io/BonysAgents/apt/). Die .deb kommen aus den neuesten Releases BEIDER
# Projekte – so überschreibt keines die Pakete des anderen.
# Auf derselben Seite (Pages veröffentlicht immer alles auf einmal): die Online-Liste „Agenten-Apps“
# (https://zappotex.github.io/BonysAgents/agenten-apps/) aus agent-apps/agent-apps.yaml auf main.
#
# Läuft
#   - nach jedem Release von Bony's Agents (release.yml ruft diesen Workflow auf),
#   - stündlich: baut nur neu, wenn sich ein Release geändert hat (versions.txt auf der Seite),
#   - bei jeder Änderung in agent-apps/ auf main – neue Einträge der Liste ohne neues Release,
#   - von Hand („Run workflow“) oder angestoßen vom Release-Workflow von bonys-vpn (gh workflow run).
#
# Secrets: APT_GPG_PRIVATE_KEY, APT_GPG_PASSPHRASE (siehe docs/RELEASE.md).
# Settings → Environments → github-pages: Tags „v*“ UND der Branch „main“ müssen deployen dürfen.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths: ["agent-apps/**"]

permissions:
  contents: read

concurrency:
  group: apt-repo
  cancel-in-progress: false

env:
  AGENTS_REPO: zappotex/BonysAgents
  VPN_REPO: zappotex/bonys-vpn
  SITE: https://zappotex.github.io/BonysAgents/apt

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.v.outputs.changed }}
    steps:
      - name: Neueste Releases mit der veröffentlichten Paketquelle vergleichen
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "bonys-agents $(gh release view -R "$AGENTS_REPO" --json tagName -q .tagName 2>/dev/null || echo -)"
            echo "bonys-vpn $(gh release view -R "$VPN_REPO" --json tagName -q .tagName 2>/dev/null || echo -)"
          } > versions.txt
          cat versions.txt
          live="$(curl -fsSL "$SITE/versions.txt" 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$live" = "$(cat versions.txt)" ]; then
            echo "Unverändert – nichts zu tun."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: main
      - name: .deb aus den neuesten Releases beider Projekte laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Je Projekt: minisign-Signatur von SHA256SUMS (Schlüssel aus der App), Prüfsumme jeder .deb, erlaubte
          # Paketnamen und Version = Tag – fehlt etwas, bricht der Workflow ab (packaging/linux/fetch-release-debs.sh)
          a=$(packaging/linux/fetch-release-debs.sh "$AGENTS_REPO" "Bony's Agents" debs bonys-agents bonys-agents-kursleiter)
          v=$(packaging/linux/fetch-release-debs.sh "$VPN_REPO" "Bony's VPN" debs bonys-vpn bonys-vpn-agentpc)
          ls -la debs
          printf 'bonys-agents %s\nbonys-vpn %s\n' "${a#* }" "${v#* }" > versions.txt
          cat versions.txt
      - name: Signierte APT-Paketquelle bauen
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret APT_GPG_PRIVATE_KEY fehlt (siehe docs/RELEASE.md)."
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          export APT_GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          packaging/linux/build-apt-repo.sh debs site/apt
          cp versions.txt site/apt/versions.txt
          # Gegenprobe: passt der Schlüssel zu dem, der in den Paketen steckt?
          gpg --batch --dearmor < packaging/linux/bonys-agents-archive-keyring.asc > "$RUNNER_TEMP/keyring.gpg"
          for suite in stable bonys-vpn; do gpgv --keyring "$RUNNER_TEMP/keyring.gpg" "site/apt/dists/$suite/InRelease"; done
      - name: Online-Liste „Agenten-Apps“ bauen
        run: |
          # Ohne --home: ~ bleibt stehen (die Shell löst es auf); bricht ab, wenn in der Liste Pflichtfelder fehlen
          sudo apt-get install -y --no-install-recommends python3-yaml
          python3 agent-apps/build_agent_apps.py agent-apps/agent-apps.yaml site/agenten-apps/index.html
          python3 agent-apps/build_agent_apps.py agent-apps/agent-apps.yaml site/agenten-apps/en/index.html \
            --uebersetzung agent-apps/agent-apps.en.yaml
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
